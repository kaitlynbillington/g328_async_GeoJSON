<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Universities in Washington State</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.5.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.5.0/mapbox-gl.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        #container {
            display: flex;
            height: 100vh;
            flex-direction: row;
            align-items: stretch;
        }

        #table {
            flex-basis: 500px;
            overflow-y: scroll;
        }

        #map {
            flex-grow: 1;
            /* map coverng the full screen */
        }

        button {
            margin-bottom: 10px;
        }
        table {
            border-collapse: collapse;
            border-spacing: 0;
            width: 100%;
            border: 1px solid #ddd;
        }

        th,
        td {
            text-align: left;
            padding: 16px;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        /* Remove sidepanel when screen is less than 1024px*/
        @media (max-width: 1024px) {
            #table {
                display: none;
            }
        }
    </style>
</head>

<body>
    <main id="container">
        <div id="table">

            <h2>Universities in Washington State</h2>
            <button onclick="sortTable()">Sort by Student Population</button>
            

            <table>
                <tr>
                    <th>Name</th>
                    <th>Year Founded</th>
                    <th>Type</th>
                    <th>Student Population</th>
                    <th>Location</th>
                </tr>
            </table>

        </div>
        <div id="map"></div>

    </main>
    <script>
        mapboxgl.accessToken = 'pk.eyJ1Ijoia2FpdGx5bmJpbGxpbmd0b24iLCJhIjoiY21oY2IzaDY3MDI2bjJpcHo3dTdndnp6OSJ9.CuU9C3o9uwHfnGBccy5s_A';
        const map = new mapboxgl.Map({
            container: 'map', // container ID
            style: 'mapbox://styles/mapbox/streets-v12', // style URL
            zoom: 5.0, // starting zoom
            center: [-120.31, 47.42] // starting center: Washington State
        });


        async function geojsonFetch() {

            // fetch geojson
            let response, wa_uni, WA_County_Boudaries, table;
                response = await fetch('assets/wa_uni.geojson');
                wa_uni = await response.json();
                response = await fetch('assets/WA_County_Boundaries.geojson');
                WA_County_Boundaries = await response.json();

                // generate the table
                table = document.getElementsByTagName("table")[0];
                let row, cell1, cell2, cell3, cell4, cell5;
                for (let i = 0; i < wa_uni.features.length; i++) {
                    // Create an empty <tr> element and add it to the 1st position of the table:
                    row = table.insertRow(-1);
                    cell1 = row.insertCell(0);
                    cell2 = row.insertCell(1);
                    cell3 = row.insertCell(2);
                    cell4 = row.insertCell(3);
                    cell5 = row.insertCell(4);
                    cell1.innerHTML = wa_uni.features[i].properties.name;
                    cell2.innerHTML = wa_uni.features[i].properties.year_founded;
                    cell3.innerHTML = wa_uni.features[i].properties.type;
                    cell4.innerHTML = wa_uni.features[i].properties.student_population;
                    cell5.innerHTML = wa_uni.features[i].properties.county;
                }


                // load data to the map as new layers and table on the side.
                map.on('load', function loadingData() {

                // add universities layer
                map.addSource('wa_uni', {
                    type: 'geojson',
                    data: wa_uni
                });

                map.addLayer({
                    'id': 'wa_uni-layer',
                    'type': 'circle',
                    'source': 'wa_uni',
                    'paint': {
                        'circle-radius': 8,
                        'circle-stroke-width': 2,
                        'circle-color': 'blue',
                        'circle-stroke-color': 'white'
                    }
                });

                // add county boundaries layer
                map.addSource('WA_County_Boundaries', {
                    type: 'geojson',
                    data: WA_County_Boundaries
                });

                map.addLayer({
                    'id': 'WA_County_Boundaries-layer',
                    'type': 'fill',
                    'source': 'WA_County_Boundaries',
                    'paint': {
                        'fill-color': '#333333', // dark grey color fill
                        'fill-opacity': 0.5
                    }
                });
                });
        }

            geojsonFetch();

        function sortTable() {
            var table, rows, switching, i, x, y, shouldSwitch;
            table = document.getElementsByTagName("table")[0];
            switching = true;
            /*Make a loop that will continue until
            no switching has been done:*/
            while (switching) {
                //start by saying: no switching is done:
                switching = false;
                rows = table.rows;
                /*Loop through all table rows (except the
                first, which contains table headers):*/
                for (i = 1; i < (rows.length - 1); i++) {
                    //start by saying there should be no switching:
                    shouldSwitch = false;
                    /*Get the two elements you want to compare,
                    one from current row and one from the next:*/
                    x = parseFloat(rows[i].getElementsByTagName("td")[3].innerHTML);
                    y = parseFloat(rows[i + 1].getElementsByTagName("td")[3].innerHTML);
                    //check if the two rows should switch place:
                    if (x < y) {
                        //if so, mark as a switch and break the loop:
                        shouldSwitch = true;
                        break;
                    }
                }
                if (shouldSwitch) {
                    /*If a switch has been marked, make the switch
                    and mark that a switch has been done:*/
                    rows[i].parentNode.insertBefore(rows[i + 1], rows[i]);
                    switching = true;
                }
            }
        }


    </script>

</body>

</html>
